# NOTE: this file must stay valid against the RenderCV schema — the "Render a CV"
# GitHub Action runs `rendercv render` on it. RenderCV rejects unknown top-level
# keys, so do NOT add `label`, `image`, `summary`, or `address` here: they are
# al-folio-only fields and each one fails the build with
#   "This field is unknown for this object. Please remove it."
# Put that content in a `sections:` entry instead (as done with Summary below).
#
# NOTE ON SECTION NAMES: the website CV page (al_folio_cv gem) only has dedicated
# templates for Education, Experience, Volunteer, Awards, Publications, Skills,
# Languages, Interests, Certificates, Projects and References. Any other section
# name falls back to a generic renderer that ONLY prints `bullet` or
# `label` + `details` entries — anything else renders as an empty card.
#
# Source of truth: raw/optional/{experience,education,awards,certifications}.md
# (NOT the older CV PDF, whose venues, dates and GPA are out of date).
